# SPDX-License-Identifier: Apache-2.0
name: "Deprecated: [Release] Create New Release"
on:
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  print-deprecated:
    name: Print Deprecated Warning
    runs-on: hl-cn-default-lin-sm
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Print Deprecation Warning
        run: |
          echo "::warning::This workflow is deprecated and will be removed in a future release."
          exit 1
